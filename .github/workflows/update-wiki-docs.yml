name: Wiki Documentation - Incremental Update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - generate but do NOT push to wiki"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    name: Update Wiki from Last Commit

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Check for relevant changes
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(ts|tsx|js|jsx|json)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No relevant source changes"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Changed files:"
            echo "$CHANGED"
          fi

      - name: Checkout wiki repo
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
        continue-on-error: true

      - name: Initialize wiki if missing
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ ! -d "wiki-repo/.git" ]; then
            mkdir -p wiki-repo
            cd wiki-repo
            git init
            echo "# Wiki" > Home.md
          fi

      - name: Update wiki pages
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/update_wiki_incremental.py

      - name: Copy updated pages
        if: steps.check.outputs.skip != 'true'
        run: |
          for f in /tmp/wiki-pages/*.md; do
            [ -f "$f" ] && cp "$f" wiki-repo/
          done

      - name: Commit and push
        if: steps.check.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes"
          else
            COMMIT_MSG=$(git -C .. log -1 --pretty=%s)
            git commit -m "docs: update for '$COMMIT_MSG'"
            git push origin HEAD:master
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Wiki Incremental Update" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "No relevant changes - skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "Updated pages:" >> $GITHUB_STEP_SUMMARY
            for f in /tmp/wiki-pages/*.md 2>/dev/null; do
              [ -f "$f" ] && echo "- $(basename "$f")" >> $GITHUB_STEP_SUMMARY
            done
          fi
