name: AI-Powered Wiki Documentation

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Force full documentation rebuild (ignores diff)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    name: Generate Project-Specific Wiki Documentation

    steps:
      # ── 1. Checkout source ────────────────────────────────────────────────
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0          # full history needed for accurate diffs

      # ── 2. Determine which files changed (or all files on full rebuild) ───
      - name: Resolve files to document
        id: files
        run: |
          FULL="${{ github.event.inputs.full_rebuild }}"
          EVENT="${{ github.event_name }}"

          if [[ "$FULL" == "true" || "$EVENT" == "workflow_dispatch" ]]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            FILES=$(find src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) | sort)
          else
            # Files changed in the last push (handles merge commits too)
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
              | grep -E '^src/.*\.(ts|tsx|js|jsx)$' || true)
          fi

          if [[ -z "$FILES" ]]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No relevant source files changed – skipping documentation update."
            exit 0
          fi

          echo "no_changes=false" >> $GITHUB_OUTPUT

          # Persist file list for later steps
          echo "$FILES" > /tmp/files_to_document.txt
          echo "Found files:"
          cat /tmp/files_to_document.txt

      # ── 3. Bundle all relevant source into one payload ────────────────────
      - name: Bundle source files for AI analysis
        if: steps.files.outputs.no_changes != 'true'
        run: |
          python3 - <<'PYTHON'
          import os, json, pathlib

          files_path = "/tmp/files_to_document.txt"
          with open(files_path) as f:
            changed = [l.strip() for l in f if l.strip()]

          # Also always include package.json + tsconfig for full context
          context_files = ["package.json", "tsconfig.json"]
          all_src = sorted(
            set(str(p) for p in pathlib.Path("src").rglob("*")
                if p.suffix in {".ts", ".tsx", ".js", ".jsx"} and p.is_file())
          )

          def read(fp):
            try:
              return pathlib.Path(fp).read_text(encoding="utf-8", errors="replace")
            except Exception as e:
              return f"[Could not read: {e}]"

          bundle = {
            "changed_files": changed,
            "context_files": {fp: read(fp) for fp in context_files if os.path.exists(fp)},
            "all_source_files": {fp: read(fp) for fp in all_src},
          }

          with open("/tmp/source_bundle.json", "w") as out:
            json.dump(bundle, out)

          total = sum(len(v) for v in bundle["all_source_files"].values())
          print(f"Bundled {len(all_src)} source files ({total:,} chars total)")
          PYTHON

      # ── 4. Call Claude API for each wiki page ─────────────────────────────
      - name: Generate wiki pages via Claude
        if: steps.files.outputs.no_changes != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPO:       ${{ github.repository }}
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          COMMIT_MESSAGE:    ${{ github.event.head_commit.message }}
          COMMIT_TIMESTAMP:  ${{ github.event.head_commit.timestamp }}
          TRIGGERED_BY:      ${{ github.actor }}
          EVENT_NAME:        ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import os, json, time, pathlib, textwrap, sys
          import urllib.request, urllib.error

          ANTHROPIC_API_KEY = os.environ["ANTHROPIC_API_KEY"]
          REPO              = os.environ["GITHUB_REPO"]
          SHA               = os.environ["GITHUB_SHA"]
          RUN_ID            = os.environ["GITHUB_RUN_ID"]
          SERVER_URL        = os.environ["GITHUB_SERVER_URL"]
          COMMIT_MSG        = os.environ.get("COMMIT_MESSAGE", "workflow_dispatch")
          TIMESTAMP         = os.environ.get("COMMIT_TIMESTAMP", "")
          ACTOR             = os.environ["TRIGGERED_BY"]
          EVENT             = os.environ["EVENT_NAME"]

          with open("/tmp/source_bundle.json") as f:
            bundle = json.load(f)

          # ── helpers ──────────────────────────────────────────────────────
          def call_claude(system_prompt: str, user_prompt: str, max_tokens: int = 4096) -> str:
            payload = {
              "model": "claude-opus-4-5",
              "max_tokens": max_tokens,
              "system": system_prompt,
              "messages": [{"role": "user", "content": user_prompt}],
            }
            req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(payload).encode(),
              headers={
                "x-api-key":         ANTHROPIC_API_KEY,
                "anthropic-version": "2023-06-01",
                "content-type":      "application/json",
              },
              method="POST",
            )
            for attempt in range(3):
              try:
                with urllib.request.urlopen(req, timeout=120) as resp:
                  return json.loads(resp.read())["content"][0]["text"]
              except urllib.error.HTTPError as e:
                body = e.read().decode()
                print(f"HTTP {e.code}: {body}", file=sys.stderr)
                if e.code in {429, 529} and attempt < 2:
                  time.sleep(30 * (attempt + 1))
                else:
                  raise
            return ""

          def fmt_sources(files: dict) -> str:
            """Format a dict of {path: content} into a readable block."""
            parts = []
            for path, content in files.items():
              parts.append(f"### FILE: {path}\n```\n{content}\n```")
            return "\n\n".join(parts)

          def footer(page: str) -> str:
            run_url = f"{SERVER_URL}/{REPO}/actions/runs/{RUN_ID}"
            commit_url = f"{SERVER_URL}/{REPO}/commit/{SHA}"
            return (
              f"\n\n---\n"
              f"*Auto-generated by [workflow run #{RUN_ID}]({run_url}) "
              f"· commit [`{SHA[:7]}`]({commit_url}): {COMMIT_MSG} "
              f"· {TIMESTAMP}*"
            )

          all_src_text   = fmt_sources(bundle["all_source_files"])
          context_text   = fmt_sources(bundle["context_files"])
          changed_list   = "\n".join(f"- {f}" for f in bundle["changed_files"])

          # Shared system prompt that applies to every page
          BASE_SYSTEM = textwrap.dedent("""
            You are a senior software engineer writing wiki documentation for a real project.
            You have access to the COMPLETE source code of the project.

            Rules:
            - Document ONLY what actually exists in the code. Never invent features, endpoints, or types.
            - Use real names: actual function names, interface names, file paths, variable names from the code.
            - If a piece of logic is complex or non-obvious, explain WHY it works that way based on the code.
            - Use real code snippets copied verbatim from the source (keep them short and focused).
            - If something isn't implemented yet or is a stub, say so explicitly.
            - Write in clear, technical prose. Use markdown tables where useful.
            - Do NOT add generic boilerplate, placeholder text, or "TODO: fill this in" sections.
            - Output raw Markdown only. No preamble, no commentary outside the document.
          """).strip()

          out_dir = pathlib.Path("/tmp/wiki-pages")
          out_dir.mkdir(exist_ok=True)

          # ── Page definitions ─────────────────────────────────────────────
          pages = [

            # 1. Home / Overview
            {
              "filename": "Home.md",
              "user_prompt": textwrap.dedent(f"""
                PROJECT CONTEXT (package.json, tsconfig.json):
                {context_text}

                ALL SOURCE FILES:
                {all_src_text}

                ---

                Write the **Home** wiki page for this project. Include:
                1. **What this project actually does** – derive from the code, not just the package name.
                2. **Key capabilities** – list the real features you can see implemented.
                3. **Tech stack** – exact versions from package.json. Note any non-obvious library choices.
                4. **Repository structure** – real directory tree with a one-line description of each folder/file's purpose based on what you see in the code.
                5. **Quick-start** – how to install and run, derived from scripts in package.json.
                6. **Links** to the other wiki pages (Architecture, API-Endpoints, Components, Data-Models, Business-Logic).

                Do NOT include sections you cannot fill from the actual code.
              """).strip() + footer("Home"),
            },

            # 2. Architecture
            {
              "filename": "Architecture.md",
              "user_prompt": textwrap.dedent(f"""
                ALL SOURCE FILES:
                {all_src_text}

                PROJECT CONFIG:
                {context_text}

                ---

                Write the **Architecture** wiki page. Include:
                1. **High-level architecture** – how the pieces fit together (entry point → routing → pages → components → services/API layer).
                   Use a mermaid diagram if the flow is non-trivial.
                2. **Directory structure** – every folder under src/ with its actual role.
                3. **Data flow** – trace a real user interaction from UI event → state change → API call → re-render, using real function/component names.
                4. **State management approach** – what hooks/context/libraries are used and why (based on the actual code patterns).
                5. **Build & tooling** – real scripts, real compiler options from tsconfig (strict mode, paths aliases, etc.).
                6. **Notable design decisions** – patterns you observe in the code worth calling out (e.g. custom hooks for data fetching, error boundary usage, etc.).

                Ground every claim in the actual source.
              """).strip() + footer("Architecture"),
            },

            # 3. API Endpoints
            {
              "filename": "API-Endpoints.md",
              "user_prompt": textwrap.dedent(f"""
                ALL SOURCE FILES:
                {all_src_text}

                ---

                Write the **API Endpoints & Data Fetching** wiki page. Include:

                1. **Endpoint inventory** – find every HTTP call in the codebase. For each one, produce a table row:
                   | Method | URL / Path | Called from (file + function) | Purpose |
                   Extract the actual URL strings or template literals from the code. If the base URL is a constant or env var, name it.

                2. **Request & response shapes** – for each endpoint, document the TypeScript types used for the request body and response (copy the actual interface/type names and their fields).

                3. **Error handling** – how does the code handle API errors? Show the actual pattern used.

                4. **Authentication** – are tokens/headers set? Where? Copy the relevant code snippet.

                5. **Environment variables** – list every env var related to API configuration (REACT_APP_*, etc.) found in the code.

                If there are NO API calls, say so and document the local data patterns instead.

                Only document endpoints that actually exist in the code.
              """).strip() + footer("API-Endpoints"),
            },

            # 4. Components
            {
              "filename": "Components.md",
              "user_prompt": textwrap.dedent(f"""
                ALL SOURCE FILES:
                {all_src_text}

                ---

                Write the **Components** wiki page. Include:

                1. **Component inventory** – every exported React component. For each:
                   - File path
                   - Component name
                   - Props interface (copy the actual TypeScript interface/type)
                   - What it renders and its responsibility in the UI
                   - Key state (useState calls and what they track)
                   - Side effects (useEffect calls and when they fire)

                2. **Component hierarchy** – which components render which (parent → child tree).
                   Use indented text or a mermaid diagram.

                3. **Custom hooks** – list any custom hooks (files/functions starting with `use`).
                   For each: signature, parameters, return value, and what it encapsulates.

                4. **Shared/reusable patterns** – any components or hooks used in multiple places.

                5. **Styling approach** – CSS modules, styled-components, Tailwind, etc. – whatever is actually used.

                Use real code snippets (props interfaces, key JSX blocks) to make this concrete.
              """).strip() + footer("Components"),
            },

            # 5. Data Models
            {
              "filename": "Data-Models.md",
              "user_prompt": textwrap.dedent(f"""
                ALL SOURCE FILES:
                {all_src_text}

                ---

                Write the **Data Models & Types** wiki page. Include:

                1. **All TypeScript interfaces and types** – copy every `interface` and `type` definition from the codebase, organised by domain/feature. For each, explain what it represents in the business context.

                2. **Enums** – list every `enum`, its values, and where it is used.

                3. **Type relationships** – if types reference each other, show the relationship
                   (e.g. `MoodEntry` contains `MoodType` enum, used by `MoodList` component).

                4. **Data validation** – any runtime validation logic (Zod, Yup, manual checks) found in the code.

                5. **Local storage / persistence schema** – if the app persists data to localStorage, sessionStorage, or IndexedDB, document the keys and shapes.

                Copy the actual type/interface definitions verbatim as code blocks.
              """).strip() + footer("Data-Models"),
            },

            # 6. Business Logic
            {
              "filename": "Business-Logic.md",
              "user_prompt": textwrap.dedent(f"""
                ALL SOURCE FILES:
                {all_src_text}

                ---

                Write the **Business Logic** wiki page. This page documents the non-trivial logic that makes this application work, beyond simple CRUD.

                1. **Core domain concepts** – what real-world concepts does this app model? (e.g. "mood entries", "streaks", "averages") Derive from the code.

                2. **Key algorithms & calculations** – any sorting, scoring, aggregation, date math, streak calculations, etc. For each:
                   - What it computes
                   - The actual function name and file
                   - A short explanation of the algorithm with a real code snippet

                3. **Validation rules** – any business rules enforced in the code (e.g. "a mood rating must be 1–5", "entries cannot be in the future").

                4. **Feature flags / configuration** – any constants or env vars that toggle behaviour.

                5. **Edge cases handled** – places in the code where edge cases are explicitly handled (empty states, error states, loading states).

                6. **Changed files in this commit** (for context):
                {changed_list}

                Only describe logic that actually exists. Quote real function names and file paths.
              """).strip() + footer("Business-Logic"),
            },
          ]

          # ── Generate each page ───────────────────────────────────────────
          for page in pages:
            print(f"\n→ Generating {page['filename']} ...", flush=True)
            try:
              content = call_claude(BASE_SYSTEM, page["user_prompt"], max_tokens=4096)
              dest = out_dir / page["filename"]
              dest.write_text(content, encoding="utf-8")
              print(f"  ✓ {dest} ({len(content):,} chars)")
            except Exception as e:
              print(f"  ✗ Failed: {e}", file=sys.stderr)
              # Write a minimal error page so the wiki doesn't silently lose a page
              (out_dir / page["filename"]).write_text(
                f"# {page['filename'].replace('-', ' ').replace('.md','')}\n\n"
                f"⚠️ Documentation generation failed for this run.\n\nError: `{e}`\n"
              )
            time.sleep(2)   # gentle rate-limit buffer between calls

          print("\n✅ All pages generated.")
          PYTHON

      # ── 5. Checkout wiki and apply generated pages ────────────────────────
      - name: Checkout wiki
        if: steps.files.outputs.no_changes != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo

      - name: Apply generated pages to wiki
        if: steps.files.outputs.no_changes != 'true'
        run: |
          # Copy every generated page into the wiki repo.
          # Pages NOT touched this run are left untouched (incremental updates).
          for file in /tmp/wiki-pages/*.md; do
            page=$(basename "$file")
            cp "$file" "wiki-repo/$page"
            echo "  copied → $page"
          done

      - name: Commit and push wiki
        if: steps.files.outputs.no_changes != 'true'
        run: |
          cd wiki-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "✅ Wiki already up to date – no commit needed."
          else
            EVENT="${{ github.event_name }}"
            if [[ "$EVENT" == "push" ]]; then
              MSG="docs: AI analysis of ${{ github.event.head_commit.message }} (${{ github.sha }})"
            else
              MSG="docs: Manual full rebuild by ${{ github.actor }}"
            fi
            git commit -m "$MSG [skip ci]"
            git push
            echo "✅ Wiki pushed successfully."
          fi

      # ── 6. Job summary ────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 📚 AI Wiki Documentation Update"
            echo ""
            if [[ "${{ steps.files.outputs.no_changes }}" == "true" ]]; then
              echo "ℹ️ No relevant source changes detected – wiki was not updated."
            else
              echo "| | |"
              echo "|---|---|"
              echo "| **Trigger** | ${{ github.event_name }} |"
              echo "| **Commit** | \`${{ github.sha }}\` |"
              echo "| **Message** | ${{ github.event.head_commit.message }} |"
              echo "| **Actor** | ${{ github.actor }} |"
              echo ""
              echo "### Updated Wiki Pages"
              for page in Home Architecture API-Endpoints Components Data-Models Business-Logic; do
                echo "- [[$page]]"
              done
              echo ""
              echo "[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            fi
          } >> $GITHUB_STEP_SUMMARY
