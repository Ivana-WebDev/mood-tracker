name: Wiki Documentation - AI Analysis

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read     # required to call the GitHub Models / Copilot API with GITHUB_TOKEN

jobs:
  analyze-and-document:
    runs-on: ubuntu-latest
    name: Analyze Code & Update Wiki Documentation

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ─────────────────────────────────────────────
      # STEP 1 – Discover component folders & diff
      # ─────────────────────────────────────────────
      - name: Discover components and detect last-commit diff
        id: discover
        run: |
          COMPONENTS_ROOT="mood-tracker/client/src/components"

          # All component folders (one level deep)
          COMPONENT_FOLDERS=$(find "$COMPONENTS_ROOT" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort)

          if [ -z "$COMPONENT_FOLDERS" ]; then
            echo "⚠️  No component folders found under $COMPONENTS_ROOT"
            echo "component_folders=" >> $GITHUB_OUTPUT
            echo "changed_components=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found component folders:"
          echo "$COMPONENT_FOLDERS"

          # Folders touched by the last commit
          LAST_COMMIT_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD 2>/dev/null || echo "")
          echo "Last commit files:"
          echo "$LAST_COMMIT_FILES"

          CHANGED=""
          while IFS= read -r folder; do
            FOLDER_NAME=$(basename "$folder")
            # Check if any file in this folder was in the last commit diff
            if echo "$LAST_COMMIT_FILES" | grep -q "^mood-tracker/client/src/components/$FOLDER_NAME/"; then
              CHANGED="$CHANGED,$FOLDER_NAME"
            fi
          done <<< "$COMPONENT_FOLDERS"

          CHANGED="${CHANGED#,}"  # strip leading comma

          # Store folder list as newline-delimited, base64-encoded to survive env
          FOLDERS_B64=$(echo "$COMPONENT_FOLDERS" | base64 -w 0)
          echo "component_folders_b64=$FOLDERS_B64" >> $GITHUB_OUTPUT
          echo "changed_components=$CHANGED" >> $GITHUB_OUTPUT
          echo "components_root=$COMPONENTS_ROOT" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────
      # STEP 2 – Checkout wiki
      # ─────────────────────────────────────────────
      - name: Checkout wiki
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-temp

      # ─────────────────────────────────────────────
      # STEP 3 – Generate per-component wiki pages
      # ─────────────────────────────────────────────
      - name: Generate component documentation via GitHub Copilot (Models API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT_FOLDERS_B64: ${{ steps.discover.outputs.component_folders_b64 }}
          CHANGED_COMPONENTS: ${{ steps.discover.outputs.changed_components }}
          COMPONENTS_ROOT: ${{ steps.discover.outputs.components_root }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cat > /tmp/generate-docs.js << 'NODESCRIPT'
          const fs   = require('fs');
          const path = require('path');

          // GitHub Models / Copilot API — uses the built-in GITHUB_TOKEN, no extra secret needed.
          // The endpoint is the Azure-compatible OpenAI endpoint surfaced by GitHub Models.
          const GH_TOKEN              = process.env.GH_TOKEN;
          const COMPONENT_FOLDERS_B64 = process.env.COMPONENT_FOLDERS_B64 || '';
          const CHANGED_COMPONENTS    = (process.env.CHANGED_COMPONENTS || '').split(',').filter(Boolean);
          const COMPONENTS_ROOT       = process.env.COMPONENTS_ROOT;
          const GITHUB_RUN_ID         = process.env.GITHUB_RUN_ID;
          const GITHUB_SERVER_URL     = process.env.GITHUB_SERVER_URL;
          const GITHUB_REPOSITORY     = process.env.GITHUB_REPOSITORY;
          const GITHUB_ACTOR          = process.env.GITHUB_ACTOR;

          // ── helpers ──────────────────────────────────────────────────────────────

          function readFolderContents(folderPath) {
            const files = {};
            function walk(dir) {
              let entries;
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); }
              catch { return; }
              for (const entry of entries) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walk(full);
                } else if (/\.(ts|tsx|css|scss|json)$/.test(entry.name)) {
                  try { files[full] = fs.readFileSync(full, 'utf8'); }
                  catch { files[full] = '(unreadable)'; }
                }
              }
            }
            walk(folderPath);
            return files;
          }

          function buildPrompt(componentName, files) {
            const fileList = Object.entries(files)
              .map(([p, c]) => `### File: ${p}\n\`\`\`\n${c.slice(0, 6000)}\n\`\`\``)
              .join('\n\n');

            return `You are a senior TypeScript / React developer writing GitHub Wiki documentation.
          Analyse the source code below for the "${componentName}" component and produce a single Markdown wiki page.

          The page MUST include these sections (use ## headings):
          1. **Overview** – one paragraph describing what this component does and its purpose in the app.
          2. **File Structure** – table listing each file in the folder and its role.
          3. **Props & Interfaces** – document every exported TypeScript interface / type, including each field, its type and a short description.
          4. **State & Hooks** – list all useState / useReducer / custom hooks with what they track and when they update.
          5. **Key Logic** – explain the most important business logic, algorithms, or side effects (useEffect, event handlers, data transforms).
          6. **API / Data Fetching** – document every fetch / axios / service call: method, URL/endpoint, request shape, response shape, and how the data is used.
          7. **Rendered Output** – describe the UI structure and any conditional rendering rules.
          8. **Dependencies** – list external packages imported and why each is used.
          9. **Usage Example** – a realistic JSX snippet showing how to use the component.

          Write in clear technical prose. Use tables and code blocks liberally. Do NOT add a top-level H1 title – the wiki will supply it.

          --- SOURCE FILES ---
          ${fileList}`;
          }

          // GitHub Models API — OpenAI-compatible chat completions endpoint.
          // Uses the workflow's built-in GITHUB_TOKEN; no extra secrets required.
          // Model: gpt-4o is the default Copilot model available via GitHub Models.
          // If your org has a different model configured (e.g. o3, o4-mini), change the
          // `model` field below to match.
          async function callCopilot(prompt) {
            const resp = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${GH_TOKEN}`,
              },
              body: JSON.stringify({
                model: 'gpt-4o',
                max_tokens: 4096,
                messages: [
                  {
                    role: 'system',
                    content: 'You are a senior TypeScript/React developer. Write clear, accurate GitHub Wiki documentation from source code. Use Markdown with tables and code blocks. Be thorough but concise.',
                  },
                  { role: 'user', content: prompt },
                ],
              }),
            });

            if (!resp.ok) {
              const err = await resp.text();
              throw new Error(`GitHub Models API error ${resp.status}: ${err}`);
            }

            const data = await resp.json();
            return data.choices[0].message.content;
          }

          // ── main ─────────────────────────────────────────────────────────────────

          async function main() {
            if (!COMPONENT_FOLDERS_B64) {
              console.log('No component folders found. Skipping.');
              return;
            }

            const foldersRaw = Buffer.from(COMPONENT_FOLDERS_B64, 'base64').toString('utf8').trim();
            const folders    = foldersRaw.split('\n').filter(Boolean);

            console.log(`\nProcessing ${folders.length} component folder(s).`);
            console.log(`Components changed in last commit: ${CHANGED_COMPONENTS.join(', ') || 'none'}\n`);

            const wikiDir  = 'wiki-temp';
            const runUrl   = `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`;
            const timestamp = new Date().toISOString();

            // Keep track of generated page names for the index
            const generatedPages = [];

            for (const folderPath of folders) {
              const componentName = path.basename(folderPath);
              const wikiPageName  = `Component-${componentName}`;
              const wikiFilePath  = path.join(wikiDir, `${wikiPageName}.md`);

              const pageExists = fs.existsSync(wikiFilePath);

              // Skip if page exists AND component not in last-commit diff
              if (pageExists && !CHANGED_COMPONENTS.includes(componentName)) {
                console.log(`⏭  ${componentName}: page exists, no changes in last commit – skipping.`);
                generatedPages.push({ componentName, wikiPageName, status: 'unchanged' });
                continue;
              }

              const action = pageExists ? 'Updating' : 'Creating';
              console.log(`🔍 ${action} documentation for: ${componentName}`);

              const files = readFolderContents(folderPath);
              if (Object.keys(files).length === 0) {
                console.log(`   ⚠️  No .ts/.tsx/.css files found – skipping.`);
                continue;
              }

              const prompt   = buildPrompt(componentName, files);
              let   docBody;
              try {
                docBody = await callCopilot(prompt);
              } catch (err) {
                console.error(`   ❌ GitHub Models API call failed: ${err.message}`);
                continue;
              }

              const header = [
                `# ${componentName}`,
                '',
                `> **Last Updated**: ${timestamp}  `,
                `> **Updated By**: Automated Workflow – [Run #${GITHUB_RUN_ID}](${runUrl})  `,
                `> **Triggered By**: ${GITHUB_ACTOR}`,
                '',
                '---',
                '',
              ].join('\n');

              fs.writeFileSync(wikiFilePath, header + docBody);
              console.log(`   ✅ ${wikiFilePath} written.`);
              generatedPages.push({ componentName, wikiPageName, status: pageExists ? 'updated' : 'created' });
            }

            // ── Update / create the Components Index page ───────────────────────
            const indexPath = path.join(wikiDir, 'Components.md');
            const allWikiPages = fs.readdirSync(wikiDir)
              .filter(f => f.startsWith('Component-') && f.endsWith('.md'))
              .map(f => f.replace('.md', ''));

            const indexRows = allWikiPages
              .sort()
              .map(p => {
                const compName = p.replace('Component-', '');
                const info     = generatedPages.find(g => g.componentName === compName);
                const badge    = info ? (info.status === 'created' ? ' 🆕' : info.status === 'updated' ? ' 🔄' : '') : '';
                return `| [[${compName}|${p}]] | \`mood-tracker/client/src/components/${compName}/\` |${badge} |`;
              })
              .join('\n');

            const indexContent = [
              '# Components',
              '',
              `> **Last Updated**: ${timestamp}  `,
              `> **Workflow Run**: [Run #${GITHUB_RUN_ID}](${runUrl})`,
              '',
              '---',
              '',
              'This page is the index of all React components in the Mood Tracker application.',
              'Each row links to a dedicated wiki page with full documentation auto-generated from source code.',
              '',
              '| Component | Source Path | Status |',
              '|-----------|-------------|--------|',
              indexRows,
              '',
              '---',
              '',
              '🆕 = new page created this run &nbsp;&nbsp; 🔄 = updated this run',
            ].join('\n');

            fs.writeFileSync(indexPath, indexContent);
            console.log(`\n📄 Components index updated: ${indexPath}`);

            // Summary to stdout for the next step
            console.log('\n::SUMMARY_START::');
            console.log(JSON.stringify(generatedPages));
            console.log('::SUMMARY_END::');
          }

          main().catch(err => {
            console.error('Fatal:', err);
            process.exit(1);
          });
          NODESCRIPT

          node /tmp/generate-docs.js

      # ─────────────────────────────────────────────
      # STEP 4 – Commit & push wiki
      # ─────────────────────────────────────────────
      - name: Commit and push wiki changes
        run: |
          cd wiki-temp
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          CHANGED="${{ steps.discover.outputs.changed_components }}"
          if [ -n "$CHANGED" ]; then
            COMMIT_MSG="docs: Update wiki for changed components: $CHANGED"
          else
            COMMIT_MSG="docs: Update wiki – manual trigger by ${{ github.actor }}"
          fi

          if git diff --cached --quiet; then
            echo "✅ No wiki changes – documentation already up to date."
          else
            git commit -m "$COMMIT_MSG [skip ci]"
            git push
            echo "✅ Wiki updated successfully!"
          fi

      # ─────────────────────────────────────────────
      # STEP 5 – Job summary
      # ─────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "## 📚 Wiki Documentation Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | Manual dispatch by **${{ github.actor }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Components changed in last commit | \`${{ steps.discover.outputs.changed_components || 'none' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What happened" >> $GITHUB_STEP_SUMMARY
          echo "- Each folder under \`mood-tracker/client/src/components/\` gets its own wiki page" >> $GITHUB_STEP_SUMMARY
          echo "- Pages for components **not** changed in the last commit were skipped" >> $GITHUB_STEP_SUMMARY
          echo "- Pages for **new** component folders were created" >> $GITHUB_STEP_SUMMARY
          echo "- The **Components** index page was refreshed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Wiki](${{ github.server_url }}/${{ github.repository }}/wiki)" >> $GITHUB_STEP_SUMMARY