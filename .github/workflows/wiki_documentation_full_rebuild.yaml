name: Wiki Documentation — Full Rebuild

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to document"
        required: true
        default: "main"
      dry_run:
        description: "Dry run — generate pages but do NOT push to wiki"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  models: read

jobs:
  rebuild-wiki:
    runs-on: ubuntu-latest
    name: Full Wiki Rebuild from Source

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
        continue-on-error: true

      - name: Initialize wiki repo if missing
        run: |
          if [ ! -d "wiki-repo/.git" ]; then
            mkdir -p wiki-repo
            cd wiki-repo
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
            echo "# Wiki" > Home.md
            git add Home.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: initialise wiki"
            git push origin HEAD:master || true
          fi

      - name: Wipe existing wiki pages
        run: find wiki-repo -maxdepth 1 -name "*.md" -delete

      - name: Generate wiki pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_wiki.py

      - name: Copy pages to wiki repo
        run: cp /tmp/wiki-pages/*.md wiki-repo/

      - name: Commit and push wiki
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: rebuild wiki from ${{ github.event.inputs.branch }} @ ${{ github.sha }}" || echo "No changes"
          git push origin HEAD:master

      - name: Summary
        run: |
          echo "## Wiki Rebuild Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in /tmp/wiki-pages/*.md; do
            [ -f "$f" ] && echo "- $(basename "$f") — $(wc -c < "$f") bytes" >> $GITHUB_STEP_SUMMARY
          done
