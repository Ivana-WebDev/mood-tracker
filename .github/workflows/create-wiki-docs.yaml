name: Wiki Documentation - Initial Setup

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  initialize-wiki:
    runs-on: ubuntu-latest
    name: Generate Full Wiki Documentation

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      ########################################################
      # STEP 1 — Checkout Wiki
      ########################################################

      - name: Checkout wiki repo
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-temp

      - name: Clean old generated docs
        run: |
          cd wiki-temp

          rm -f Home.md
          rm -f Architecture.md
          rm -f Components.md
          rm -f Component-*.md

          echo "Old generated pages removed."

      ########################################################
      # STEP 2 — Collect Metadata
      ########################################################

      - name: Collect project metadata
        id: meta
        run: |
          COMPONENTS_ROOT="client/src/components"

          COMPONENT_ITEMS=$(find "$COMPONENTS_ROOT" \
            \( -type d -o -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.jsx" \) \
            ! -name "*.test.*" \
            ! -name "*.spec.*" \
            ! -path "*/node_modules/*" \
            2>/dev/null | sort)

          ITEMS_B64=$(echo "$COMPONENT_ITEMS" | base64 -w 0)

          echo "component_items_b64=$ITEMS_B64" >> $GITHUB_OUTPUT
          echo "components_root=$COMPONENTS_ROOT" >> $GITHUB_OUTPUT

          PKG_NAME=$(jq -r '.name // "client-app"' client/package.json)
          PKG_VER=$(jq -r '.version // "0.0.0"' client/package.json)
          PKG_DESC=$(jq -r '.description // ""' client/package.json)

          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_ver=$PKG_VER" >> $GITHUB_OUTPUT
          echo "pkg_desc=$PKG_DESC" >> $GITHUB_OUTPUT

      ########################################################
      # STEP 3 — Generate Docs with GitHub Models API
      ########################################################

      - name: Generate wiki docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT_ITEMS_B64: ${{ steps.meta.outputs.component_items_b64 }}
          COMPONENTS_ROOT: ${{ steps.meta.outputs.components_root }}
          PKG_NAME: ${{ steps.meta.outputs.pkg_name }}
          PKG_VER: ${{ steps.meta.outputs.pkg_ver }}
          PKG_DESC: ${{ steps.meta.outputs.pkg_desc }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cat > /tmp/wiki-generator.js << 'EOF'
          const fs = require("fs");
          const path = require("path");

          const WIKI_DIR = "wiki-temp";
          const CLIENT_ROOT = "client";
          const SRC_ROOT = "client/src";

          const RUN_URL =
            `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          const TS = new Date().toISOString();

          const COMPONENT_ITEMS = process.env.COMPONENT_ITEMS_B64
            ? Buffer.from(process.env.COMPONENT_ITEMS_B64, "base64")
                .toString("utf8")
                .trim()
                .split("\n")
                .filter(Boolean)
            : [];

          const PKG_NAME = process.env.PKG_NAME;
          const PKG_VER = process.env.PKG_VER;
          const PKG_DESC = process.env.PKG_DESC;
          const GH_TOKEN = process.env.GH_TOKEN;

          function footer() {
            return `

---

*Auto-generated by workflow run #${process.env.GITHUB_RUN_ID} · ${TS}*
`;
          }

          function readFileSafe(filePath) {
            try {
              return fs.readFileSync(filePath, "utf8");
            } catch {
              return "";
            }
          }

          function readFolderContents(folderPath) {
            const files = {};

            function walk(dir) {
              let entries;
              try {
                entries = fs.readdirSync(dir, { withFileTypes: true });
              } catch {
                return;
              }

              for (const entry of entries) {
                const full = path.join(dir, entry.name);

                if (entry.isDirectory()) {
                  walk(full);
                } else if (/\.(js|jsx|ts|tsx|css|scss|json)$/.test(entry.name)) {
                  files[full] = readFileSafe(full);
                }
              }
            }

            walk(folderPath);
            return files;
          }

          function findComponentUsages(componentName, rootDir) {
            const matches = [];

            function walk(dir) {
              let entries;
              try {
                entries = fs.readdirSync(dir, { withFileTypes: true });
              } catch {
                return;
              }

              for (const entry of entries) {
                const full = path.join(dir, entry.name);

                if (entry.isDirectory()) {
                  if (
                    ["node_modules", ".git", "dist", "build"].includes(entry.name)
                  ) {
                    continue;
                  }

                  walk(full);
                } else if (/\.(js|jsx|ts|tsx)$/.test(entry.name)) {
                  const content = readFileSafe(full);

                  if (
                    content.includes(`<${componentName}`) ||
                    content.includes(`from './${componentName}`) ||
                    content.includes(`from "../${componentName}`)
                  ) {
                    matches.push({
                      file: full,
                      snippet: content.slice(0, 3000),
                    });
                  }
                }
              }
            }

            walk(rootDir);
            return matches;
          }

          async function callCopilot(prompt) {
            const response = await fetch(
              "https://models.inference.ai.azure.com/chat/completions",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${GH_TOKEN}`,
                },
                body: JSON.stringify({
                  model: "gpt-4o",
                  max_tokens: 4000,
                  messages: [
                    {
                      role: "system",
                      content:
                        "You are a senior React engineer writing GitHub Wiki documentation.",
                    },
                    {
                      role: "user",
                      content: prompt,
                    },
                  ],
                }),
              }
            );

            if (!response.ok) {
              const error = await response.text();
              throw new Error(error);
            }

            const data = await response.json();
            return data.choices[0].message.content;
          }

          function buildComponentPrompt(name, files, usages) {
            const fileBlock = Object.entries(files)
              .map(
                ([file, content]) =>
                  `### File: ${file}\n\`\`\`\n${content.slice(0, 6000)}\n\`\`\``
              )
              .join("\n\n");

            const usageBlock = usages.length
              ? usages
                  .map(
                    (u) =>
                      `### Used in: ${u.file}\n\`\`\`\n${u.snippet}\n\`\`\``
                  )
                  .join("\n\n")
              : "No usages found.";

            return `
          Write detailed GitHub Wiki documentation for the React component "${name}"

          Include:

          ## Overview
          ## Props & Interfaces
          ## State & Hooks
          ## Business Logic
          ## Rendered UI
          ## Dependencies
          ## Where This Component Is Used
          ## Parent / Child Component Relationships
          ## API Integration
          ## Usage Example

          Use markdown tables heavily.

          --- SOURCE FILES ---
          ${fileBlock}

          --- USAGE REFERENCES ---
          ${usageBlock}
          `;
          }

          async function main() {
            const componentNames = [];

            for (const item of COMPONENT_ITEMS) {
              const stat = fs.statSync(item);
              let componentName;
              let files;

              if (stat.isDirectory()) {
                componentName = path.basename(item);
                files = readFolderContents(item);
              } else {
                componentName = path.basename(item).replace(/\.(js|jsx|ts|tsx)$/,"");
                files = {
                  [item]: readFileSafe(item),
                };
              }

              if (!Object.keys(files).length) continue;

              componentNames.push(componentName);

              console.log(`Generating docs for ${componentName}`);

              const usages = findComponentUsages(componentName, SRC_ROOT);
              const prompt = buildComponentPrompt(componentName, files, usages);

              let result;

              try {
                result = await callCopilot(prompt);
              } catch (e) {
                console.log(`Failed for ${componentName}`);
                console.log(e.message);
                continue;
              }

              fs.writeFileSync(
                path.join(WIKI_DIR, `Component-${componentName}.md`),
                `# ${componentName}\n\n${result}${footer()}`
              );
            }

            const componentsTable = componentNames
              .map(
                (name) =>
                  `| [[${name}|Component-${name}]] | client/src/components/${name} |`
              )
              .join("\n");

            fs.writeFileSync(
              path.join(WIKI_DIR, "Components.md"),
              `# Components

| Component | Path |
|---|---|
${componentsTable}

${footer()}
`
            );

            fs.writeFileSync(
              path.join(WIKI_DIR, "Home.md"),
              `# Home

## About

Project: ${PKG_NAME}

Version: ${PKG_VER}

${PKG_DESC}

## Wiki Navigation

- [[Architecture]]
- [[Components]]

${footer()}
`
            );

            fs.writeFileSync(
              path.join(WIKI_DIR, "Architecture.md"),
              `# Architecture

## Overview

This page describes the architecture of ${PKG_NAME}.

## Component Structure

See [[Components]]

${footer()}
`
            );
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node /tmp/wiki-generator.js

      ########################################################
      # STEP 4 — Commit Wiki
      ########################################################

      - name: Commit and push wiki
        run: |
          cd wiki-temp

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: auto-generate wiki docs [skip ci]"
            git push
          fi